name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  e2e:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUXT_PUBLIC_API_BASE: https://shopmarker-backend.onrender.com
      E2E_BASE_URL: http://localhost:3000
      E2E_API_BASE_URL: https://shopmarker-backend.onrender.com
      E2E_PRODUCT_ID: '9264'
      E2E_PRODUCT_PRICE: '2199'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
